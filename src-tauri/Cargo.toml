[package]
name = "glossline"
version = "2026.9.16"
description = "Glossline — 會議即時字幕與雙軌錄音"
authors = ["FFC225"]
edition = "2021"

[lib]
name = "my_translator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Enabled only for dev builds (via scripts/tauri-with-env.mjs) to expose the WebView
# inspector. Release builds (npm run build / tauri build) never enable this.
devtools = ["tauri/devtools"]

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = "0.4"
cpal = "0.15"
rubato = "0.16"
# reqwest / tokio / tokio-tungstenite / futures-util /
# http / base64 / uuid / sha2 / hex / rand went out with the 20 commands (TTS, MLX,
# OpenAI and Qwen). Soniox talks over the frontend WebSocket, so nothing in Rust
# opens a socket any more. Put one back only together with the code that needs it.
# sherpa-onnx removed: offline TTS unused, and it is the
# most common Windows build breaker (pulls native ONNX Runtime at build time).
tauri-plugin-dialog = "2"
# tar/bzip2 removed with the Piper voice downloader.
# ed25519-dalek / rand_core removed with the licence key (open source, free).
# Compressed copy of each recording (them.mp3 /
# me.mp3). LAME is LGPL, so it is *not* linked in: it is a separate
# libmp3lame.dll beside the exe (built from source by tools/build_lame_dll.bat)
# and loaded at run time. libloading is ISC and already in the tree via tauri.
libloading = "0.8"

# macOS: ScreenCaptureKit for system audio
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
screencapturekit = "1.5"

# Windows: WASAPI for system audio (legacy loopback only)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_Foundation",
  # applog.rs:SetStdHandle (Console) + GetFileType
  # (FileSystem, to detect that the launcher is already capturing us).
  "Win32_System_Console",
  "Win32_Storage_FileSystem",
  # precheck.rs:RegGetValueW, for the Windows build
  # number. GetVersionEx lies without an application manifest, and 11 still
  # calls itself 10 everywhere but the build number.
  "Win32_System_Registry",
] }

# tauri-plugin-updater / tauri-plugin-process removed:
# the updater pointed at unsigned GitHub-release .exe files (unsigned binaries are never run).
